<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="서울대학교 첨단융합학부 배규현의 개인 홈페이지" />
    <title>배규현 | 개인 홈페이지</title>
    <style>
      :root { --ink:#172033; --muted:#5f6b7b; --line:#dbe3ef; --paper:#fff; --canvas:#f5f8fc; --blue:#2457d6; --blue-pale:#eaf0ff; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; min-width:320px; color:var(--ink); background:var(--canvas); font-family:"Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; line-height:1.7; }
      .wrap { width:min(100% - 2.5rem, 62rem); margin:0 auto; }
      header { padding:1.25rem 0; background:rgba(245,248,252,.9); border-bottom:1px solid var(--line); }
      nav { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
      .logo { font-weight:800; letter-spacing:-.04em; }
      nav a { color:var(--muted); font-size:.95rem; font-weight:700; text-decoration:none; }
      nav a:hover { color:var(--blue); }
      main { padding:4.5rem 0 5rem; }
      .hero { padding:clamp(2rem,7vw,4.5rem); background:var(--paper); border:1px solid var(--line); border-radius:1.5rem; box-shadow:0 1rem 3rem rgba(28,52,92,.08); }
      .profile { display:block; width:clamp(5.5rem,16vw,7.5rem); aspect-ratio:1; margin:0 0 1.5rem; object-fit:cover; border:4px solid var(--blue-pale); border-radius:50%; }
      .eyebrow { margin:0 0 .8rem; color:var(--blue); font-size:.9rem; font-weight:800; letter-spacing:.08em; }
      h1, h2 { letter-spacing:-.05em; }
      h1 { margin:0; font-size:clamp(2.5rem,9vw,5.5rem); line-height:1.05; }
      .intro { max-width:35rem; margin:1.5rem 0 0; color:var(--muted); font-size:clamp(1rem,2.5vw,1.2rem); }
      .sections { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; margin-top:1rem; }
      section { padding:2rem; background:var(--paper); border:1px solid var(--line); border-radius:1rem; }
      section:last-child { grid-column:1 / -1; }
      h2 { margin:0 0 .75rem; font-size:1.35rem; }
      p { margin:0; }
      .tags { display:flex; flex-wrap:wrap; gap:.55rem; margin:1rem 0 0; padding:0; list-style:none; }
      .tags li { padding:.35rem .8rem; color:#193d9a; background:var(--blue-pale); border-radius:99rem; font-size:.92rem; font-weight:700; }
      .contact-link { display:inline-flex; align-items:center; gap:.5rem; margin-top:1rem; padding:.65rem 1rem; color:#fff; background:var(--blue); border-radius:.6rem; font-weight:800; text-decoration:none; }
      .contact-link:hover { background:#1948be; }
      footer { padding:0 0 2.5rem; color:var(--muted); font-size:.88rem; text-align:center; }
      @media (max-width:38rem) { .wrap { width:min(100% - 1.5rem,62rem); } header { padding:1rem 0; } main { padding:1.5rem 0 3rem; } .hero, section { padding:1.5rem; } .sections { grid-template-columns:1fr; } section:last-child { grid-column:auto; } }
    </style>
  </head>
  <body>
    <header><nav class="wrap" aria-label="주요 메뉴"><span class="logo">GYUHYUN BAE</span><a href="#contact">연락처</a></nav></header>
    <main class="wrap">
      <article class="hero" aria-labelledby="name">
        <p class="eyebrow">PERSONAL HOME</p>
        <img class="profile" src="assets/profile.jpg" alt="배규현 프로필 사진" />
        <h1 id="name">배규현</h1>
        <p class="intro">서울대학교 첨단융합학부에서 배우고, 새로운 기술이 사람들의 일상에 닿는 방식을 고민합니다.</p>
      </article>
      <div class="sections">
        <section id="about" aria-labelledby="about-title"><h2 id="about-title">소개</h2><p>서울대학교 첨단융합학부에 재학 중입니다. 다양한 분야를 연결하는 배움과 경험을 쌓아가고 있습니다.</p></section>
        <section id="interests" aria-labelledby="interests-title"><h2 id="interests-title">관심사</h2><ul class="tags" aria-label="관심사 목록"><li>웹 개발</li><li>인공지능</li><li>융합 기술</li></ul></section>
        <section id="contact" aria-labelledby="contact-title"><h2 id="contact-title">연락처</h2><p>프로젝트와 아이디어에 관한 이야기를 나누고 싶다면 GitHub에서 연락해 주세요.</p><a class="contact-link" href="https://github.com/bgh0711" target="_blank" rel="noreferrer">GitHub 프로필 열기 <span aria-hidden="true">↗</span></a></section>
      </div>
    </main>
    <footer class="wrap">© 2026 배규현</footer>
  </body>
</html>
